{% extends "base.html" %}
{% block title %}Add Customer – Homzho ERP{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('customers.index') }}">Customers</a></li>
        <li class="breadcrumb-item active">Add Customer</li>
      </ol>
    </nav>
    <h1 class="page-title">Add New Customer</h1>
  </div>
</div>

<form method="POST" action="{{ url_for('customers.add') }}" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="row g-3">

    <!-- Customer Info -->
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-person-fill text-primary"></i> Customer Information</div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="cust_name" class="form-control" placeholder="e.g. Rajesh Kumar" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Contact Number <span class="text-danger">*</span></label>
              <input type="tel" name="contact_number" class="form-control" placeholder="10-digit mobile" required
                maxlength="15" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Email (optional)</label>
              <input type="email" name="email_id" class="form-control" placeholder="customer@email.com" />
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea name="address" class="form-control" rows="2" placeholder="Full address"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Area/Locality</label>
              <input type="text" name="area" class="form-control" placeholder="e.g. Banjara Hills" />
            </div>
            <div class="col-md-4">
              <label class="form-label">City</label>
              <input type="text" name="city" class="form-control" placeholder="City" />
            </div>
            <div class="col-md-4">
              <label class="form-label">PIN Code</label>
              <input type="text" name="pin" class="form-control" placeholder="6-digit PIN" maxlength="6" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Plan Info -->
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-file-earmark-text-fill text-primary"></i> Rental Plan</div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Plan Name <span class="text-danger">*</span></label>
              <select name="plan_id" id="planSelect" class="form-select" required>
                <option value="">Select plan</option>
                {% for p in plans %}
                <option value="{{ p.plan_id }}" data-days="{{ p.validity_in_days }}" data-cost="{{ p.cost }}"
                  data-freq="{{ p.payment_frequency }}" {% if loop.first %}selected{% endif %}>
                  {{ p.plan_name }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Validity</label>
              <input type="text" id="planValidity" class="form-control" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label">Plan Start Date <span class="text-danger">*</span></label>
              <input type="date" name="plan_start_date" class="form-control" required value="{{ today.isoformat() }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Plan Cost</label>
              <input type="text" id="planCost" class="form-control" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label">Payment Frequency</label>
              <input type="text" id="planFrequency" class="form-control" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label">Deposit (₹)</label>
              <input type="number" name="deposit" class="form-control" placeholder="0" min="0" step="0.01" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Machine Assignment -->
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-cpu-fill text-primary"></i> Machine Assignment</div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Assign Machine (optional)</label>
              <select name="machine_id" class="form-select">
                <option value="">— No machine yet —</option>
                {% for m in machines %}
                <option value="{{ m.machine_id }}">{{ m.machine_serial_no }} – {{ m.model_name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Installation Date</label>
              <input type="date" name="installation_date" class="form-control" value="{{ today.isoformat() }}" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Installation Cost (₹)</label>
              <input type="number" name="installation_cost" class="form-control" placeholder="0" min="0" step="0.01" />
            </div>
            <div class="col-12">
              <label class="form-label">Installed By</label>
              <input type="text" name="installed_by" class="form-control" placeholder="Technician name" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Notes -->
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-sticky-fill text-primary"></i> Notes</div>
        <div class="card-body">
          <textarea name="notes" class="form-control" rows="8"
            placeholder="Any additional notes about this customer…"></textarea>
        </div>
      </div>
    </div>

    <!-- Submit -->
    <div class="col-12">
      <div class="d-flex gap-2 justify-content-end">
        <a href="{{ url_for('customers.index') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
        <button type="submit" class="btn btn-primary btn-lg">
          <i class="bi bi-person-check-fill me-2"></i> Save Customer
        </button>
      </div>
    </div>
  </div>
</form>

<script>
  function updatePlanPreview() {
    const selected = document.getElementById('planSelect')?.selectedOptions[0];
    document.getElementById('planValidity').value = selected?.dataset.days ? `${selected.dataset.days} days` : '';
    document.getElementById('planCost').value = selected?.dataset.cost ? `Rs ${selected.dataset.cost}` : '';
    document.getElementById('planFrequency').value = selected?.dataset.freq || '';
  }
  document.getElementById('planSelect')?.addEventListener('change', updatePlanPreview);
  updatePlanPreview();
</script>
{% endblock %}
