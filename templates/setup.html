{% extends "base.html" %}
{% block title %}Initial Setup – Homzho ERP{% endblock %}

{% block content %}
<div class="auth-card" style="max-width:480px">
  <div class="auth-logo">
    <div class="auth-logo-icon"><i class="bi bi-droplet-fill"></i></div>
    <span class="auth-logo-text">Homzho</span>
  </div>
  <h1 class="auth-title">First-Time Setup</h1>
  <p class="auth-sub">Create your administrator account to get started.</p>

  <form method="POST" action="{{ url_for('auth.setup') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" name="full_name" class="form-control" placeholder="Administrator" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" placeholder="admin" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" placeholder="admin@homzho.com" required />
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required />
    </div>

    <button type="submit" class="btn btn-primary w-100 btn-lg">
      <i class="bi bi-shield-check me-2"></i>Create Admin Account
    </button>
  </form>
</div>
{% endblock %}
