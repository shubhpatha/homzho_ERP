{% extends "base.html" %}
{% block title %}Login – Homzho ERP{% endblock %}

{% block content %}
<div class="auth-card">
  <!-- Logo -->
  <div class="auth-logo">
    <div class="auth-logo-icon"><i class="bi bi-droplet-fill"></i></div>
    <span class="auth-logo-text">Homzho</span>
  </div>

  <h1 class="auth-title">Welcome Back</h1>
  <p class="auth-sub">Sign in to access the ERP dashboard</p>

  <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <div class="position-relative">
        <i class="bi bi-envelope position-absolute top-50 translate-middle-y ms-3 text-muted"></i>
        <input type="email" id="email" name="email" class="form-control ps-5"
               placeholder="you@example.com" required autocomplete="email" />
      </div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <div class="position-relative">
        <i class="bi bi-lock position-absolute top-50 translate-middle-y ms-3 text-muted"></i>
        <input type="password" id="password" name="password" class="form-control ps-5"
               placeholder="••••••••" required autocomplete="current-password" />
        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y me-1 p-1 border-0"
                onclick="togglePw()" style="background:none;color:rgba(255,255,255,.5)">
          <i class="bi bi-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <div class="mb-4 d-flex align-items-center justify-content-between">
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="remember" name="remember" />
        <label class="form-check-label text-white-50" for="remember" style="font-size:13px;">Remember me</label>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 btn-lg">
      <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
    </button>
  </form>

  <p class="text-center mt-4" style="color:rgba(255,255,255,.4); font-size:12px;">
    Homzho Water Purifier ERP &copy; {{ today.year }}
  </p>
</div>

<script>
function togglePw() {
  const pw = document.getElementById('password');
  const ic = document.getElementById('eyeIcon');
  if (pw.type === 'password') {
    pw.type = 'text'; ic.className = 'bi bi-eye-slash';
  } else {
    pw.type = 'password'; ic.className = 'bi bi-eye';
  }
}
</script>
{% endblock %}
